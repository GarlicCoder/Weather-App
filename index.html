<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <div id="mainContainer">
     
      <div id="top">
        <div id="header">
         
          <div id="logoContainer"> 
           <span id="weatherSvg" class="svg"></span>
           <h1>Weather Dashboard</h1>
            </div>
            <div id="timeContainer"><span id="currentDate"></span><span id="currentTime"></span>
            </div>
        </div>
      <div id="searchContainer">
      <input type="text" id="cityInput" placeholder="Enter a city (Ex: Los Angeles) " value="Los Angeles">
      <button id="searchBtn" class="btn">Submit</button>
      <button id="locationBtn" class="btn"><span id="pinSvg" class="svg"></span></button>
      </div>
      </div>
      <div id="bottom">
        <div class="loading" id="loading">
          <div class="loader"></div>
          <p>Contacting our weather casters...</p>
        </div>
        <div id="weatherInfo">
          <div id="weatherTop">
              <div id="cityContainer">
                  <h2 id="cityName"></h2>
                    <!-- <button id="unitToggle" class="btn">Toggle Unit</button> -->
            </div>
          </div>
          <div id="weatherDataContainer">
            <div id="today">
              <h4>Today's Weather</h4>
              <div id="today-item">
                <img id="weatherIcon" alt="Weather icon">
                <span id="temp"></span>
                <p id="weatherDescr"></p>
              </div>
              <div id="statsContainer">
                <div class="stats">
                  <span class="bold"><span id="waterSvg" class="svg"></span> Humidity: </span>
                  <span id="humidity"></span>
                </div>
                <div class="stats">
                  <span class="bold"><span id="windSvg" class="svg"></span> Wind:</span>
                  <span id="wind"></span>
                </div>
                <div class="stats">
                  <span class="bold">
                    <span id="tempSvg" class="svg"></span> Feels Like:</span>
                  <span id="feelsLike"></span>
                </div>
                <div class="stats">
                  <span class="bold"><span id="eyeSvg" class="svg"></span> Visibility: </span>
                  <span id="visibility"></span></div>
              </div>
              </div>
              
           <div id="forecastContainer"><h4>Next Few Days...</h4><div id="forecast" class="forecast">
          </div>
            </div>
            
     
        </div>
      </div>  
    </div>

   
    <script src="script.js"></script>
  </body>
</html>
